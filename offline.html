<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuruhAja - Offline</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f4f4f4; }
        .offline-card { text-align: center; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 0 15px rgba(0,0,0,0.1); max-width: 360px; }
        .offline-card img { width: 96px; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; color: #333; margin-bottom: 8px; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="icon-192.png" alt="SuruhAja">
        <h1>Kamu sedang offline</h1>
        <p>Periksa koneksi internetmu dan coba lagi.</p>
    </div>
</body>
</html>
